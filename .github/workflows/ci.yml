name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
      - run: nix develop --command cargo fmt --all -- --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make check-rfds
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
      - run: bash -n .agents/dev .agents/setup scripts/*.sh
      - run: nix develop --command cargo clippy --locked --workspace --all-targets --all-features -- --deny warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make check-rfds
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
      - run: nix develop --command cargo test --locked --workspace --all-targets --all-features

  qemu-replay:
    name: QEMU record/replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
      - run: nix develop --command ./scripts/qemu-replay-smoke-test.sh
      - run: nix develop --command ./scripts/qemu-network-replay-smoke-test.sh
      - run: nix develop --command ./scripts/time-model-probe-test.sh
      - run: nix develop --command ./scripts/time-model-input-probe-test.sh
      - run: nix develop --command ./scripts/time-model-gate-test.sh
      - run: nix develop --command ./scripts/rfd3-phase0-spike-test.sh
      - run: nix develop --command ./scripts/rfd3-phase1-evidence.sh
      - name: RFD 3 phase 2 guest runtime
        # The runtime changes root, drops credentials, and creates device nodes,
        # and its guest-wide cleanup barrier needs a private PID namespace, so
        # the test binary is built unprivileged and then run as PID 1 under sudo.
        run: |
          binary="$(nix develop --command bash -c '
            set -euo pipefail
            cargo test --locked --test rfd3_phase2 --no-run --message-format=json-render-diagnostics |
              jq -r "select(.reason == \"compiler-artifact\" and .target.name == \"rfd3_phase2\" and .executable != null) | .executable" |
              tail -1
          ')"
          test -x "$binary"
          nix develop --command sudo --preserve-env=PATH,SIMFERRET_BUSYBOX \
            env SIMFERRET_PHASE2_TEST_BINARY="$binary" \
            ./scripts/rfd3-phase2-runtime.sh
      - name: RFD 3 phase 4 guest-visible conformance
        # The conformance check changes root, drops credentials, and creates
        # device nodes, and its guest-wide cleanup barrier needs a private PID
        # namespace, so the test binary is built unprivileged and then run as
        # PID 1 under sudo.
        run: |
          binary="$(nix develop --command bash -c '
            set -euo pipefail
            cargo test --locked --test rfd3_phase4 --no-run --message-format=json-render-diagnostics |
              jq -r "select(.reason == \"compiler-artifact\" and .target.name == \"rfd3_phase4\" and .executable != null) | .executable" |
              tail -1
          ')"
          test -x "$binary"
          nix develop --command sudo --preserve-env=PATH,SIMFERRET_BUSYBOX \
            env SIMFERRET_PHASE4_TEST_BINARY="$binary" \
            ./scripts/rfd3-phase4-runtime.sh
      - run: nix develop --command ./scripts/rfd3-phase4-checks-test.sh
      - run: nix develop --command ./scripts/phase4-acceptance-test.sh
      # The Phase 4 acceptance runs the Phase 3 record-and-two-replay
      # demonstration for both source forms and adds the assembly-cost,
      # ambient-input, classification, and volume evidence.
      - run: nix develop --command ./scripts/rfd3-phase4-acceptance.sh
      - run: nix develop --command ./scripts/qemu-replay-smoke.sh
      - run: nix develop --command ./scripts/qemu-network-replay-smoke.sh
      # The Phase 0 time-model gate runs the real probe under the pinned model
      # and fails unless every requested run completes, the verdict is
      # `reproducible`, and the guest measurements equal the reference host's.
      - run: nix develop --command ./scripts/time-model-gate.sh
      # The known record-mode result: with rr=record and sleep=off, QEMU queues
      # live serial input and never flushes the queue. Asserting it here makes a
      # QEMU change that starts delivering input visible, because that would
      # unblock pinning the model in the product.
      - name: Pinned model host-input assertion
        run: nix develop --command ./scripts/time-model-input-probe.sh --expect not-delivered
      - run: nix develop --command ./scripts/phase4-acceptance.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qemu-replay-diagnostics
          # The Phase 4 run directories and the workload store carry the private
          # replay closure, the exact workload streams, and the recorded launch
          # environment, so only the acceptance report, the process status, and
          # the shareable failure bundles are uploaded.
          path: |
            .poc/qemu-replay-smoke/
            .poc/qemu-network-replay-smoke/
            .poc/phase4-acceptance/
            .poc/rfd3-phase1-evidence/
            .poc/rfd4-phase0-gate/gate.*/gate.txt
            .poc/rfd4-phase0-gate/gate.*/probe.stdout
            .poc/rfd4-phase0-gate/gate.*/probe.stderr
            .poc/rfd4-phase0-gate/gate.*/run.*/evidence.txt
            .poc/rfd4-phase0-gate/gate.*/run.*/incomplete.txt
            .poc/rfd4-phase0-gate/gate.*/run.*/measurements.txt
            .poc/rfd4-phase0-gate/gate.*/run.*/*.status
            .poc/rfd4-phase0-gate/gate.*/run.*/*.duration-ns
            .poc/rfd4-phase0-gate/gate.*/run.*/*.serial
            .poc/rfd4-phase0-gate/gate.*/run.*/*.qemu.log
            .poc/time-model-input-probe/run.*/evidence.txt
            .poc/time-model-input-probe/run.*/serial.log
            .poc/time-model-input-probe/run.*/qemu.log
            .poc/rfd3-phase4-acceptance/*/evidence.txt
            .poc/rfd3-phase4-acceptance/*/*.status
            .poc/rfd3-phase4-acceptance/*/*.duration-ns
            .poc/rfd3-phase4-acceptance/*/*.stdout
            .poc/rfd3-phase4-acceptance/*/*.stderr
            .poc/rfd3-phase4-acceptance/*/phase3/run.*/*.status
            .poc/rfd3-phase4-acceptance/*/phase3/run.*/*.duration-ns
            .poc/rfd3-phase4-acceptance/*/phase3/run.*/*.stdout
            .poc/rfd3-phase4-acceptance/*/phase3/run.*/*.stderr
            .poc/rfd3-phase4-acceptance/*/phase3/run.*/*/failures/**
          if-no-files-found: ignore
