name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
      - run: nix develop --command cargo fmt --all -- --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make check-rfds
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
      - run: bash -n .agents/dev .agents/setup scripts/*.sh
      - run: nix develop --command cargo clippy --locked --workspace --all-targets --all-features -- --deny warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make check-rfds
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
      - run: nix develop --command cargo test --locked --workspace --all-targets --all-features

  qemu-replay:
    name: QEMU record/replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
      - run: nix develop --command ./scripts/qemu-replay-smoke-test.sh
      - run: nix develop --command ./scripts/qemu-network-replay-smoke-test.sh
      - run: nix develop --command ./scripts/time-model-probe-test.sh
      - run: nix develop --command ./scripts/rfd3-phase0-spike-test.sh
      - run: nix develop --command ./scripts/rfd3-phase1-evidence.sh
      - name: RFD 3 phase 2 guest runtime
        # The runtime changes root, drops credentials, and creates device nodes,
        # and its guest-wide cleanup barrier needs a private PID namespace, so
        # the test binary is built unprivileged and then run as PID 1 under sudo.
        run: |
          binary="$(nix develop --command bash -c 'cargo test --locked --test rfd3_phase2 --no-run --message-format=json 2>/dev/null | jq -r "select(.reason == \"compiler-artifact\" and .target.name == \"rfd3_phase2\" and .executable != null) | .executable" | tail -1')"
          test -x "$binary"
          nix develop --command sudo --preserve-env=PATH,SIMFERRET_BUSYBOX \
            env SIMFERRET_PHASE2_TEST_BINARY="$binary" \
            ./scripts/rfd3-phase2-runtime.sh
      - run: nix develop --command ./scripts/phase4-acceptance-test.sh
      - run: nix develop --command ./scripts/rfd3-phase3-acceptance.sh
      - run: nix develop --command ./scripts/qemu-replay-smoke.sh
      - run: nix develop --command ./scripts/qemu-network-replay-smoke.sh
      - run: nix develop --command ./scripts/phase4-acceptance.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qemu-replay-diagnostics
          path: |
            .poc/qemu-replay-smoke/
            .poc/qemu-network-replay-smoke/
            .poc/phase4-acceptance/
            .poc/rfd3-phase1-evidence/
            .poc/rfd3-phase3-acceptance/
          if-no-files-found: ignore
