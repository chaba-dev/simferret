[package]
name = "simferret"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
libc = "0.2.175"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
toml = "0.9.5"

[[bin]]
name = "simferret"
path = "src/main.rs"
